name: saas-ci

on:
  push:
    branches: [main, saas/**]
    paths: ['saas/**', '.github/workflows/saas-ci.yml']
  pull_request:
    paths: ['saas/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: saas/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Prisma schema validate
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Unit + integration tests
        run: npm test
      # TODO next phases: migration checks, authorization/tenant-isolation
      # suites, Playwright E2E against a staging build, security scanning.

NOTE: kept here because the current GitHub token lacks the `workflow` scope.
Move to .github/workflows/saas-ci.yml (and adjust the checkout paths) to activate.
